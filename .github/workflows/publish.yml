name: Publish

# Runs only after the "CI" workflow succeeds on main (push). No duplicate test
# matrix here—checkout matches the exact commit CI validated.

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed
    branches: [main]

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve publish targets
    runs-on: ubuntu-latest

    # PRs trigger CI but must not publish. Only push-to-main runs (including merges).
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    permissions:
      contents: read
      packages: read

    outputs:
      publish_npm: ${{ steps.meta.outputs.publish_npm }}
      publish_github: ${{ steps.meta.outputs.publish_github }}
      github_pkg_name: ${{ steps.meta.outputs.github_pkg_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # GitHub Packages auth for `npm view` only—never touch the default npmrc used
      # for `npm publish` to npmjs (OIDC).
      - name: Compare local version to registries
        id: meta
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          BASE_NAME=$(node -p "require('./package.json').name.replace(/^@[^/]+\//,'')")
          NPM_NAME=$(node -p "require('./package.json').name")
          GH_PKG_NAME="@${OWNER_LC}/${BASE_NAME}"
          LOCAL=$(node -p "require('./package.json').version")

          printf '%s\n' "//npm.pkg.github.com/:_authToken=${GITHUB_PACKAGES_TOKEN}" > "${RUNNER_TEMP}/npmrc-github-packages"

          NPM_REMOTE=$(npm view "${NPM_NAME}" version 2>/dev/null || true)
          GH_REMOTE=$(npm view "${GH_PKG_NAME}" version --registry https://npm.pkg.github.com --userconfig "${RUNNER_TEMP}/npmrc-github-packages" 2>/dev/null || true)

          echo "local_version=${LOCAL}" >> "${GITHUB_OUTPUT}"
          echo "github_pkg_name=${GH_PKG_NAME}" >> "${GITHUB_OUTPUT}"

          if [ "${LOCAL}" = "${NPM_REMOTE}" ]; then
            echo "publish_npm=false" >> "${GITHUB_OUTPUT}"
            echo "npm: ${LOCAL} already published"
          else
            echo "publish_npm=true" >> "${GITHUB_OUTPUT}"
            echo "npm: will publish ${LOCAL} (registry latest: ${NPM_REMOTE:-none})"
          fi

          if [ "${LOCAL}" = "${GH_REMOTE}" ]; then
            echo "publish_github=false" >> "${GITHUB_OUTPUT}"
            echo "GitHub Packages: ${LOCAL} already published"
          else
            echo "publish_github=true" >> "${GITHUB_OUTPUT}"
            echo "GitHub Packages: will publish ${GH_PKG_NAME}@${LOCAL} (registry latest: ${GH_REMOTE:-none})"
          fi

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: resolve-version
    if: needs.resolve-version.outputs.publish_npm == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # No registry-url: avoid setup-node writing registry.npmjs.org auth lines into
      # .npmrc, which can break npm trusted publishing (OIDC).
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Publish to npm (trusted publishing / OIDC)
        run: npm publish --access public

  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: resolve-version
    if: needs.resolve-version.outputs.publish_github == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # npm does not apply NODE_AUTH_TOKEN to GitHub Packages by itself; it needs a
      # userconfig with //npm.pkg.github.com/:_authToken (setup-node’s registry-url
      # would add that but would also send @owner/* installs to GitHub and break npm ci).
      - name: Publish scoped package to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          GITHUB_PKG_NAME: ${{ needs.resolve-version.outputs.github_pkg_name }}
        run: |
          set -euo pipefail
          printf '%s\n' "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > "${RUNNER_TEMP}/npmrc-gh-publish"
          cp package.json package.json.ci-backup
          npm pkg set "name=${GITHUB_PKG_NAME}"
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm publish --registry https://npm.pkg.github.com --userconfig "${RUNNER_TEMP}/npmrc-gh-publish"
          mv package.json.ci-backup package.json
